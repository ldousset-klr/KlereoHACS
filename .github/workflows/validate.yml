name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Both validators track moving targets, so a weekly run catches a break
    # that no commit of ours caused.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what Home Assistant 2024.11 — the minimum hacs.json declares —
        # runs on; 3.13 is what current releases run on.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      # The suites stub Home Assistant out (tests/klereo_stub.py), so nothing
      # here installs homeassistant or requests.
      - run: python -m pytest

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Permanent: home-assistant/brands no longer accepts custom
          # integrations, which ship their own brand/ directory since Home
          # Assistant 2026.3, so this check can never pass here.
          ignore: brands
