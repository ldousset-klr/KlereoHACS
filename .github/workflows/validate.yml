name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The validators and the latest Home Assistant are moving targets, so a
    # weekly run catches a break that no commit of ours caused.
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

# Actions are pinned to a commit SHA, the version beside it in a comment, so a
# moved tag cannot change what runs; Dependabot (.github/dependabot.yml) bumps
# both together. hassfest and the HACS action are the exception, kept on their
# branches: each is a thin wrapper that pulls a floating image
# (ghcr.io/home-assistant/hassfest, ghcr.io/hacs/action:main), so pinning the
# wrapper would not pin what validates — and following the current rules is
# the point of running them weekly.
jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-lint.txt
      # Rules in ruff.toml; --output-format=github annotates the diff.
      - run: ruff check --output-format=github .

  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what Home Assistant 2024.11 — the minimum hacs.json declares —
        # runs on; 3.13 is what current releases run on.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-test.txt
      # The suites stub Home Assistant out (tests/klereo_stub.py), so nothing
      # here installs it. `requests` is not stubbed — it is the integration's
      # own runtime dependency and the KlereoAPI suites drive the real library.
      # Coverage per .coveragerc, which also sets the floor.
      - run: python -m pytest --cov --cov-report=term
      - if: always()
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  ha-tests:
    # The same integration inside a real Home Assistant (tests_ha/), Klereo
    # alone faked: entity registration, the flows, reload, scheduling, the
    # services. Run against the minimum hacs.json declares and the newest
    # release, so a break on either end shows before a user reports it.
    name: Home Assistant ${{ matrix.ha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2024.11.0 (minimum)"
            python-version: "3.12"
            requirements: tests_ha/requirements-min.txt
          - ha: latest
            python-version: "3.13"
            requirements: tests_ha/requirements.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r ${{ matrix.requirements }}
      # pytest-cov comes with the harness; coverage per .coveragerc.
      - run: python -m pytest -c tests_ha/pytest.ini tests_ha --cov --cov-report=term
      - if: always()
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@main
        with:
          category: integration
          # Permanent: home-assistant/brands no longer accepts custom
          # integrations, which ship their own brand/ directory since Home
          # Assistant 2026.3, so this check can never pass here.
          ignore: brands
