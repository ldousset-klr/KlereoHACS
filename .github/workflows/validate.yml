name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Both validators track moving targets, so a weekly run catches a break
    # that no commit of ours caused.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Permanent: home-assistant/brands no longer accepts custom
          # integrations, which ship their own brand/ directory since Home
          # Assistant 2026.3, so this check can never pass here.
          ignore: brands
