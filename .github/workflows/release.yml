name: Release

# A release is checked once it exists, which is the only point at which its tag,
# title and description are known together — and again whenever it is edited,
# so a fix to the description is confirmed in the same place.
on:
  release:
    types: [published, edited]

permissions:
  contents: read

jobs:
  check:
    name: check release
    runs-on: ubuntu-latest
    steps:
      # The tag being released, with every other tag, for the changelog links.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python .github/scripts/check_release.py
