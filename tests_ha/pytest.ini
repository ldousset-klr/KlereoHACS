# The suite against a real Home Assistant. Kept apart from tests/, whose stub
# replaces homeassistant.* in sys.modules and cannot share a process with it.
# Run from the repository root:
#   python -m pytest -c tests_ha/pytest.ini tests_ha
[pytest]
asyncio_mode = auto
pythonpath = ..
addopts = -q -p no:cacheprovider
